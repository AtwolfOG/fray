[package]
name = "fray-client"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = {path = "../protocol"}
client-migration = {path = "db/client-migration"}
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
sea-orm = { version = "2.0.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

