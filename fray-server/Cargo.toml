[package]
name = "fray-server"
version = "0.1.0"
edition = "2024"

[dependencies]
protocol = {path = "../protocol"}
server-migration = {path = "db/server-migration"}
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.21"
rand = "0.10.3"
sea-orm = { version = "2.0.0", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
chrono = "0.4"
redis = { version = "1.0.4", features = ["tokio-comp"] }
dotenvy = { workspace = true }
