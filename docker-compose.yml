version: "3.8"

services:
  server:    
    build:
      dockerfile: Dockerfile.server
      context: .
    environment:
      - RUST_BACKTRACE=1
    ports:
      # - "3000:8001"  # Public connections
      - "8080:8000"  # Client connections
      # - "3002:8002"  # Admin connections
    networks:
      - fray
    volumes:
      - ./fray-server.db:/app/fray-server.db

  client:
    build:
      dockerfile: Dockerfile.client
      context: .
    # ports:
    #   - "3002:3002"  # Local tunnel (example)
    depends_on:
      - server
    environment:
      - REMOTE_ADDR=server:3000  # Hostname of the server
      - RUST_BACKTRACE=full
    networks:
      - fray

networks:
  fray:
    driver: bridge
